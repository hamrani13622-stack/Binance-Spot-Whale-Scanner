name: Binance Spot Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: spot-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        run: python scanner.py

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-scanner-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
